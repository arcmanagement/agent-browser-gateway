<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent Browser Gateway</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        width: 280px;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .tab-info {
        font-size: 12px;
        color: #555;
        margin-bottom: 8px;
        word-break: break-all;
      }
      button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.primary {
        background: #007aff;
        color: white;
      }
      button.danger {
        background: #ff3b30;
        color: white;
      }
      button.secondary {
        border: 1px solid #c7c7cc;
        background: transparent;
        color: #555;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      .notice {
        margin: 8px 0;
        padding: 8px;
        border: 1px solid #ffcc00;
        border-radius: 6px;
        background: rgba(255, 204, 0, 0.14);
        color: #5c4600;
        font-size: 12px;
        line-height: 1.35;
      }
      .notice strong {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
      }
      .notice p {
        margin: 0 0 8px;
      }
      .notice button {
        padding: 6px;
        font-size: 12px;
      }
      .annotation-actions {
        display: grid;
        grid-template-columns: 1fr 74px;
        gap: 6px;
        margin-top: 8px;
      }
      .annotation-actions button {
        min-width: 0;
      }
      .annotation-actions button.annotation-on {
        background: #a444ff;
        color: white;
      }
      .status {
        font-size: 11px;
        color: #888;
        margin-top: 8px;
      }
      .setting-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #ddd;
        color: #555;
        font-size: 12px;
        line-height: 1.3;
      }
      .setting-row input[type="checkbox"] {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        margin: 0;
      }
      .setting-note {
        margin: 4px 0 0 24px;
        color: #777;
        font-size: 11px;
        line-height: 1.35;
      }
      .profile-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid #ddd;
        color: #555;
        font-size: 12px;
      }
      .profile-row label {
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-size: 10px;
        color: #888;
      }
      .profile-row input {
        width: 100%;
        padding: 6px 8px;
        font-size: 12px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .ws-ok {
        color: #34c759;
      }
      .ws-err {
        color: #ff3b30;
      }
      .shared-list {
        margin-top: 12px;
        font-size: 11px;
        color: #666;
      }
      .shared-list h2 {
        font-size: 11px;
        font-weight: 600;
        margin: 0 0 4px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .shared-item {
        padding: 2px 0;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>Agent Browser Gateway</h1>
    <div class="tab-info" id="tabInfo">…</div>
    <div class="notice" id="incognitoNotice" hidden>
      <strong>Incognito access is off</strong>
      <p>Chrome blocks ABG in incognito windows until this extension is allowed there.</p>
      <button id="openExtensionsBtn" class="secondary">Open extension settings</button>
    </div>
    <button id="actionBtn">…</button>
    <div class="annotation-actions">
      <button id="annotationBtn" class="secondary" disabled>Annotate this tab</button>
      <button id="clearAnnotationsBtn" class="secondary" disabled>Clear</button>
    </div>
    <label class="setting-row">
      <input type="checkbox" id="approvalToggle" />
      <span>Require approval for write operations</span>
    </label>
    <label class="setting-row">
      <input type="checkbox" id="evalToggle" />
      <span>Enable approved JavaScript eval</span>
    </label>
    <label class="setting-row">
      <input type="checkbox" id="allTabsToggle" />
      <span>Sandbox all-tabs profile mode</span>
    </label>
    <div class="setting-note" id="allTabsNote"></div>
    <div class="profile-row">
      <label for="profileLabel">Profile label (shown in menubar)</label>
      <input type="text" id="profileLabel" placeholder="e.g. personal, work, staging" />
    </div>
    <div class="status" id="status">…</div>
    <div class="shared-list" id="sharedList"></div>
    <script src="popup.js"></script>
  </body>
</html>
