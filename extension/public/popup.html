<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Agent Browser Gateway</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 320px;
        padding: var(--abg-space-3);
      }
      .header {
        display: flex;
        align-items: center;
        gap: var(--abg-space-2);
        margin-bottom: var(--abg-space-3);
      }
      .header img {
        width: 18px;
        height: 18px;
      }
      .header h1 {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font-size: var(--abg-text-md);
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: var(--abg-space-2);
      }
      .tab-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: var(--abg-space-2);
      }
      .tab-info {
        display: -webkit-box;
        min-width: 0;
        overflow: hidden;
        font-size: var(--abg-text-sm);
        font-weight: 500;
        line-height: 1.35;
        overflow-wrap: anywhere;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }
      #actionBtn {
        width: 100%;
      }
      .notice button {
        min-height: 28px;
        font-size: var(--abg-text-sm);
      }
      .annotation-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--abg-space-2);
      }
      .annotation-actions button {
        min-width: 0;
        min-height: 28px;
        font-size: var(--abg-text-sm);
      }
      .annotation-actions button.restore-annotations {
        grid-column: 1 / -1;
      }
      .annotation-actions button[hidden] {
        display: none;
      }
      /* Result of the last keyboard shortcut; level classes come from shortcutFeedback. */
      .shortcut-result {
        padding: 6px var(--abg-space-2);
        border: 1px solid var(--abg-neutral-line);
        border-radius: var(--abg-radius-sm);
        background: var(--abg-neutral-bg);
        color: var(--abg-neutral-text);
        font-size: var(--abg-text-xs);
        line-height: 1.4;
        overflow-wrap: anywhere;
      }
      .shortcut-result[hidden] {
        display: none;
      }
      .shortcut-result.success {
        border-color: var(--abg-success-line);
        background: var(--abg-success-bg);
        color: var(--abg-success-text);
      }
      .shortcut-result.warning {
        border-color: var(--abg-warning-line);
        background: var(--abg-warning-bg);
        color: var(--abg-warning-text);
      }
      .shortcut-result.error {
        border-color: var(--abg-danger-line);
        background: var(--abg-danger-bg);
        color: var(--abg-danger-text);
      }
      .shortcut-hint {
        margin-top: var(--abg-space-2);
      }
      .shortcut-hint:empty {
        display: none;
      }
      .section {
        margin-top: var(--abg-space-4);
      }
      .section > .label {
        margin-bottom: var(--abg-space-2);
      }
      .shared-list:empty {
        display: none;
      }
      .shared-list ul {
        margin: 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--abg-line);
        border-radius: var(--abg-radius);
        background: var(--abg-surface);
        list-style: none;
      }
      .shared-item {
        display: flex;
        align-items: center;
        gap: var(--abg-space-2);
        min-height: 30px;
        padding: 4px var(--abg-space-3);
        font-size: var(--abg-text-sm);
      }
      .shared-item + .shared-item {
        border-top: 1px solid var(--abg-line);
      }
      .shared-item .tab-id {
        flex: 0 0 auto;
        color: var(--abg-muted);
        font: 500 var(--abg-text-xs) / 1 var(--abg-mono);
      }
      .shared-item .tab-title {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .shared-item .pill {
        height: 18px;
        padding: 0 6px;
        font-size: 10px;
      }
      .shared-item .pill::before {
        display: none;
      }
      .settings {
        overflow: hidden;
        border: 1px solid var(--abg-line);
        border-radius: var(--abg-radius);
        background: var(--abg-surface);
      }
      .setting {
        padding: 10px var(--abg-space-3);
      }
      .setting + .setting {
        border-top: 1px solid var(--abg-line);
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--abg-space-3);
        font-size: var(--abg-text-sm);
        font-weight: 500;
        line-height: 1.3;
        cursor: pointer;
      }
      .setting-note {
        margin-top: var(--abg-space-1);
        padding-right: 44px;
        color: var(--abg-muted);
        font-size: var(--abg-text-xs);
        line-height: 1.4;
      }
      .setting-note:empty {
        display: none;
      }
      .setting.warning-active {
        background: var(--abg-warning-bg);
      }
      .setting.warning-active .setting-note {
        color: var(--abg-warning-text);
      }
      details.advanced {
        margin-top: var(--abg-space-4);
      }
      details.advanced summary {
        display: flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        border-radius: 4px;
        cursor: pointer;
        list-style: none;
      }
      details.advanced summary::-webkit-details-marker {
        display: none;
      }
      details.advanced summary::before {
        content: "";
        width: 0;
        height: 0;
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-left: 5px solid currentColor;
        transition: transform 120ms ease;
      }
      details.advanced[open] summary::before {
        transform: rotate(90deg);
      }
      .profile-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: var(--abg-space-3);
      }
      .profile-row label {
        font-size: var(--abg-text-sm);
        font-weight: 500;
      }
      .profile-row input {
        width: 100%;
        min-height: 30px;
        padding: 5px var(--abg-space-2);
        border: 1px solid var(--abg-line-strong);
        border-radius: var(--abg-radius-sm);
        background: var(--abg-surface);
        color: var(--abg-text);
        font: var(--abg-text-sm) / 1.3 var(--abg-font);
      }
      .profile-row input::placeholder {
        color: var(--abg-muted);
      }
      .profile-row input:focus-visible {
        outline-offset: 0;
      }
      .input-with-action {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
      }
      .input-with-action button {
        min-height: 30px;
        font-size: var(--abg-text-sm);
      }
      .field-note {
        color: var(--abg-muted);
        font-size: var(--abg-text-xs);
        line-height: 1.4;
      }
      .status {
        margin-top: var(--abg-space-3);
        color: var(--abg-muted);
        font-size: var(--abg-text-xs);
        overflow-wrap: anywhere;
      }
      .status:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="icons/48.png" alt="" />
      <h1>Agent Browser Gateway</h1>
      <span class="pill" id="gatewayStatus" role="status">Checking…</span>
    </header>

    <section class="card stack" aria-labelledby="tabInfo">
      <div class="tab-head">
        <div class="tab-info" id="tabInfo">…</div>
        <span class="pill" id="tabStatus" hidden></span>
      </div>
      <div class="notice" id="incognitoNotice" hidden>
        <strong>Incognito access is off</strong>
        <p>Chrome blocks ABG in incognito windows until this extension is allowed there.</p>
        <button id="openExtensionsBtn" class="secondary">Open extension settings</button>
      </div>
      <button id="actionBtn">…</button>
      <div class="annotation-actions">
        <button id="annotationBtn" class="secondary" disabled>Annotate this tab</button>
        <button id="clearAnnotationsBtn" class="secondary" disabled>Clear</button>
        <button id="restoreAnnotationsBtn" class="secondary restore-annotations" hidden>
          Restore saved annotations
        </button>
      </div>
      <div class="shortcut-result" id="shortcutResult" role="status" hidden></div>
    </section>
    <div class="field-note shortcut-hint" id="shortcutHint"></div>

    <section class="section shared-list" id="sharedList" aria-live="polite"></section>

    <section class="section">
      <h2 class="label">Permissions</h2>
      <div class="settings">
        <div class="setting">
          <label class="setting-row">
            <span>Require approval for write operations</span>
            <input type="checkbox" class="switch" role="switch" id="approvalToggle" />
          </label>
        </div>
        <div class="setting">
          <label class="setting-row">
            <span>Enable approved JavaScript eval</span>
            <input type="checkbox" class="switch" role="switch" id="evalToggle" />
          </label>
        </div>
        <div class="setting">
          <label class="setting-row">
            <span>Trusted automation / AutoMode</span>
            <input type="checkbox" class="switch" role="switch" id="trustedAutomationToggle" />
          </label>
          <div class="setting-note" id="trustedAutomationNote"></div>
        </div>
        <div class="setting" id="allTabsSetting">
          <label class="setting-row">
            <span>Sandbox all-tabs profile mode</span>
            <input type="checkbox" class="switch warning" role="switch" id="allTabsToggle" />
          </label>
          <div class="setting-note" id="allTabsNote"></div>
        </div>
        <div class="setting">
          <label class="setting-row">
            <span>Bookmarks access</span>
            <input type="checkbox" class="switch" role="switch" id="bookmarksToggle" />
          </label>
          <div class="setting-note" id="bookmarksNote"></div>
        </div>
        <div class="setting">
          <label class="setting-row">
            <span>Reading List access</span>
            <input type="checkbox" class="switch" role="switch" id="readingListToggle" />
          </label>
          <div class="setting-note" id="readingListNote"></div>
        </div>
        <div class="setting">
          <label class="setting-row">
            <span>Allow bookmark &amp; Reading List changes</span>
            <input type="checkbox" class="switch" role="switch" id="personalDataMutationsToggle" />
          </label>
          <div class="setting-note" id="personalDataMutationsNote"></div>
        </div>
      </div>
    </section>

    <details class="advanced">
      <summary class="label">Advanced</summary>
      <div class="profile-row">
        <label for="profileLabel">Profile label (shown in menubar)</label>
        <input type="text" id="profileLabel" placeholder="e.g. personal, work, staging" />
      </div>
      <div class="profile-row">
        <label for="gatewayWebSocketUrl">Gateway WebSocket endpoint</label>
        <div class="input-with-action">
          <input
            type="text"
            id="gatewayWebSocketUrl"
            placeholder="ws://127.0.0.1:8765/ws"
            autocomplete="off"
            spellcheck="false"
          />
          <button id="applyGatewayUrlBtn" class="secondary" type="button">Apply</button>
        </div>
        <div class="field-note">
          Developer and self-hosted diagnostics only. Applying reconnects immediately.
        </div>
      </div>
    </details>

    <div class="status" id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
