<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="approval.windowTitle">Approve operation</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 300px;
        padding: 18px var(--space-5) 14px;
      }
      /* The gate line doubles as the request timer: it drains toward automatic denial. */
      .timer {
        position: fixed;
        inset: 0 0 auto;
        height: 2px;
        background: var(--line);
      }
      .timer i {
        position: absolute;
        inset: 0;
        background: var(--signal);
        box-shadow: 0 0 8px var(--signal-glow);
        transform-origin: left center;
        animation: abg-drain linear 1 both;
        animation-duration: var(--remaining, 0ms);
        animation-play-state: paused;
      }
      .timer.running i {
        animation-play-state: running;
      }
      @keyframes abg-drain {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }
      .head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
      }
      .head .mark {
        width: 16px;
        height: 16px;
      }
      .head .label {
        flex: 1 1 auto;
        min-width: 0;
      }
      .method {
        flex: 0 0 auto;
        max-width: 50%;
        overflow: hidden;
        padding: 2px 7px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-chip);
        color: var(--text-2);
        font: 500 10.5px / 1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .method:empty {
        display: none;
      }
      .intent {
        margin: 0;
        font-size: var(--text-lg);
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.4;
        overflow-wrap: anywhere;
        text-wrap: pretty;
      }
      :lang(ja) .intent {
        font-size: 14px;
        letter-spacing: 0;
        line-height: 1.6;
      }
      body.destructive .intent {
        padding-left: 10px;
        border-left: 2px solid var(--danger);
        color: var(--danger-text);
      }
      .tab {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        padding: 8px 12px;
        border: 1px solid var(--signal-line);
        border-radius: 10px;
        background: var(--ink-2);
      }
      .tab-dot {
        flex: 0 0 auto;
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: var(--signal);
        box-shadow: 0 0 0 3px var(--signal-tint), 0 0 8px var(--signal-glow);
      }
      .tab-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .tab-title,
      .tab-url {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-title {
        font-size: var(--text-sm);
        font-weight: 500;
        line-height: 1.4;
      }
      .tab-url {
        color: var(--text-3);
        font: 400 var(--text-xs) / 1.4 var(--mono);
      }
      .tab-title:empty,
      .tab-url:empty {
        display: none;
      }
      .script {
        flex: 1 1 auto;
        min-height: 60px;
        margin: 0;
        padding: 10px 12px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--ink-1);
        color: var(--text);
        font: 400 var(--text-xs) / 1.6 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .spacer {
        flex: 1 1 auto;
      }
      /* Only the spacer and the scrollable script block may give up height; squeezing the other
         blocks clipped the footer and broke the window's content-height measurement. */
      body > :not(.spacer):not(.script) {
        flex-shrink: 0;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2);
      }
      .actions button {
        min-height: 38px;
      }
      .footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-3);
        color: var(--text-3);
        font-size: var(--text-xs);
        line-height: 1.45;
      }
      :lang(ja) .footer {
        line-height: 1.6;
      }
      .status {
        min-height: 14px;
        font-variant-numeric: tabular-nums;
      }
      .status.is-error {
        color: var(--danger-text);
      }
      .hint {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="timer" id="timer" aria-hidden="true"><i></i></div>
    <h1 class="head">
      <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
        <path class="mark-line" d="M1.75 10h4.5M13.75 10h4.5" stroke-width="1.5" stroke-linecap="round" />
        <rect x="6.75" y="3" width="2" height="14" rx="1" fill="currentColor" />
        <rect x="11.25" y="3" width="2" height="14" rx="1" fill="currentColor" />
        <circle class="mark-dot" cx="10" cy="10" r="1.25" />
      </svg>
      <span class="label" data-i18n="approval.heading">Allow this operation?</span>
      <span class="method" id="method"></span>
    </h1>
    <p class="intent" id="intent" data-i18n="approval.loading">Loading…</p>
    <div class="tab" id="tab" hidden>
      <span class="tab-dot" aria-hidden="true"></span>
      <span class="tab-text">
        <span class="tab-title" id="tabTitle"></span>
        <span class="tab-url" id="tabUrl"></span>
      </span>
    </div>
    <pre class="script" id="scriptBlock" hidden></pre>
    <div class="spacer" id="spacer"></div>
    <div class="actions">
      <button class="primary" id="allowBtn" disabled data-i18n="approval.allow">Allow</button>
      <button class="danger" id="denyBtn" disabled data-i18n="approval.deny">Deny</button>
    </div>
    <div class="footer">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="hint"><kbd>Esc</kbd><span data-i18n="approval.escToDeny">to deny</span></div>
    </div>
    <script src="approval.js"></script>
  </body>
</html>
