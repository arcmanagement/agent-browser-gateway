<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Approve Operation</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 300px;
        padding: 14px var(--abg-space-4);
      }
      .label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .label img {
        width: 14px;
        height: 14px;
      }
      .intent {
        font-size: var(--abg-text-lg);
        font-weight: 600;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .tab {
        padding: 6px 10px;
        border: 1px solid var(--abg-line);
        border-radius: var(--abg-radius-sm);
        background: var(--abg-surface);
        font-size: var(--abg-text-xs);
        line-height: 1.4;
      }
      .tab-title,
      .tab-url {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-title {
        font-weight: 600;
      }
      .tab-url {
        color: var(--abg-muted);
        font-family: var(--abg-mono);
      }
      .script {
        max-height: 190px;
        margin: 0;
        padding: var(--abg-space-2);
        overflow: auto;
        border: 1px solid var(--abg-line);
        border-radius: var(--abg-radius-sm);
        background: var(--abg-surface-2);
        font-family: var(--abg-mono);
        font-size: var(--abg-text-xs);
        line-height: 1.4;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .script[hidden] {
        display: none;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--abg-space-2);
      }
      .footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--abg-space-2);
        color: var(--abg-muted);
        font-size: var(--abg-text-xs);
      }
      .status {
        min-height: 14px;
      }
      .hint {
        flex: 0 0 auto;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <h1 class="label"><img src="icons/48.png" alt="" />Approve operation?</h1>
    <div class="intent" id="intent">Loading…</div>
    <div class="tab">
      <div class="tab-title" id="tabTitle"></div>
      <div class="tab-url" id="tabUrl"></div>
    </div>
    <pre class="script" id="scriptBlock" hidden></pre>
    <div class="actions">
      <button class="primary" id="allowBtn" disabled>Allow</button>
      <button class="danger" id="denyBtn" disabled>Deny</button>
    </div>
    <div class="footer">
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="hint"><kbd>Esc</kbd> to deny</div>
    </div>
    <script src="approval.js"></script>
  </body>
</html>
