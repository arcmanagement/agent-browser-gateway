<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Marquee promo tile</title>
    <link rel="stylesheet" href="store.css" />
    <style>
      body { --w: 1400px; --h: 560px; }
      .grid { -webkit-mask-image: radial-gradient(ellipse 55% 90% at 74% 50%, #000, transparent 80%); mask-image: radial-gradient(ellipse 55% 90% at 74% 50%, #000, transparent 80%); }
      .text { position: absolute; left: 80px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
      .lockup { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 580; letter-spacing: -0.015em; }
      .lockup svg { width: 28px; height: 28px; }
      h1 { margin: 32px 0 0; font-size: 66px; line-height: 1.02; letter-spacing: -0.046em; }
      .sub { margin-top: 24px; font-size: 20px; max-width: 470px; }
      /* Hero: the gate between one shared tab and the agent. */
      .browser { left: 720px; top: 40px; width: 640px; height: 560px; }
      .page { height: 100%; }
      .popup { left: 990px; top: 130px; width: 360px; height: 404px; }
      .popup img { width: 360px; }
      .agent { left: 566px; top: 372px; width: 410px; }
      .agent pre { font-size: 12.5px; padding: 14px 16px 16px; line-height: 1.6; }
      .agent .out { color: #c9d4cf; }
      .glow { left: 1130px; top: 300px; width: 820px; height: 820px; }
      /* The gate between the copy and the shared tab, as on the small tile. */
      .gate i { position: absolute; display: block; }
      .gate .ln { top: 285px; height: 2px; background: var(--signal); box-shadow: 0 0 10px var(--signal-glow); }
      .gate .ln.l { left: 600px; width: 26px; background: linear-gradient(90deg, transparent, var(--signal)); }
      .gate .ln.r { left: 664px; width: 58px; }
      .gate .pl { top: 250px; width: 6px; height: 72px; border-radius: 3px; background: var(--text); }
      .gate .pl.a { left: 630px; }
      .gate .pl.b { left: 654px; }
      .gate .dt { left: 637px; top: 281px; width: 10px; height: 10px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 14px 3px var(--signal-glow); }
      .ext.on::after {
        content: ""; position: absolute; right: 3px; top: 3px;
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--signal); box-shadow: 0 0 8px var(--signal-glow);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="text">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><path class="arm" d="M1.75 10h4.5M13.75 10h4.5" stroke-width="1.5" stroke-linecap="round" /><rect class="bar" x="6.75" y="3" width="2" height="14" rx="1" /><rect class="bar" x="11.25" y="3" width="2" height="14" rx="1" /><circle class="dot" cx="10" cy="10" r="1.25" /></svg>
        Agent Browser Gateway
      </div>
      <h1>Hand your agent<br />one tab.<br /><span class="dim">Nothing else.</span></h1>
    </div>

    <div class="gate"><i class="ln l"></i><i class="ln r"></i><i class="pl a"></i><i class="pl b"></i><i class="dt"></i></div>

    <div class="browser">
      <div class="bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="tab">Inbox</span>
        <span class="tab lit">Acme Outdoor — Checkout</span>
        <span class="tab">Q3 planning</span>
        <span class="tab fade">Bank</span>
      </div>
      <div class="toolbar">
        <span class="nav">‹ ›</span>
        <span class="url"><b>shop.example.com</b>/checkout</span>
        <span class="ext on">
          <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><path class="arm" d="M1.75 10h4.5M13.75 10h4.5" stroke-width="1.5" stroke-linecap="round" /><rect class="bar" x="6.75" y="3" width="2" height="14" rx="1" /><rect class="bar" x="11.25" y="3" width="2" height="14" rx="1" /><circle class="dot" cx="10" cy="10" r="1.25" /></svg>
        </span>
      </div>
      <div class="page"><img src="shots/page-checkout.png" alt="" /></div>
    </div>

    <div class="term agent">
      <div class="term-bar"><span class="dots"><i></i><i></i><i></i></span>agent — zsh</div>
      <pre><span class="p">$</span> abg read t1 --selector aside --format markdown
<span class="out"><span class="c">##</span> Order summary</span>

<span class="out"><span class="c">-</span> Trail tent, 2-person $289.00</span>
<span class="out"><span class="c">-</span> Down sleeping bag $179.00</span></pre>
    </div>

    <div class="window popup"><img src="shots/popup-shared.png" alt="" /></div>
  </body>
</html>
