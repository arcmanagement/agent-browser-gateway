<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>04 · Annotate and restore</title>
    <link rel="stylesheet" href="store.css" />
    <style>
      .browser { left: 612px; top: 92px; width: 682px; height: 575px; border-right: 0; border-radius: 14px 0 0 14px; }
      .page { height: 100%; }
      .agent { left: 72px; top: 470px; width: 540px; }
      .agent pre { font-size: 13px; line-height: 1.6; padding: 16px 18px 18px; }
      .agent .out { color: #c9d4cf; }
      .agent .ok { color: var(--signal); }
      .restore { left: 878px; top: 628px; width: 360px; height: 122px; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22px); border-top-color: transparent; }
      .restore img { width: 360px; margin-top: -312px; }
      .after { left: 1000px; top: 606px; }
      .glow { left: 1060px; top: 700px; width: 600px; height: 600px; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="copy">
      <div class="rule"><b>04</b>Annotations<span class="line"></span><span class="aperture"><i></i><em></em><i></i></span></div>
      <h1>Point at what<br /><span class="dim">you mean.</span></h1>
      <p class="sub">Mark areas or text in the tab. Your agent gets each note with its target, and saved notes survive a reload.</p>
      <div class="brand">
        <svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><path class="arm" d="M1.75 10h4.5M13.75 10h4.5" stroke-width="1.5" stroke-linecap="round" /><rect class="bar" x="6.75" y="3" width="2" height="14" rx="1" /><rect class="bar" x="11.25" y="3" width="2" height="14" rx="1" /><circle class="dot" cx="10" cy="10" r="1.25" /></svg>
        Agent Browser Gateway
      </div>
    </div>

    <div class="browser">
      <div class="bar">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="tab lit">Acme Outdoor — Checkout</span>
        <span class="tab">Q3 planning</span>
      </div>
      <div class="page"><img src="shots/page-annotated.png" alt="" /></div>
    </div>

    <div class="window restore"><img src="shots/popup-restore.png" alt="" /></div>
    <span class="chip after">after a reload</span>

    <div class="term agent">
      <div class="term-bar"><span class="dots"><i></i><i></i><i></i></span>agent — zsh<span class="tag">t1 · tab 1043</span></div>
      <pre id="out"></pre>
    </div>

    <script>
      // The lines `abg annotate --format text` prints (Sources/abg/ABG.swift), fed with the real
      // overlay result captured by render.mjs.
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
      window.__ready = fetch("shots/annotate-list.json")
        .then((r) => r.json())
        .then((d) => {
          const lines = [`annotation mode: ${d.enabled ? "on" : "off"}, ${d.count} annotation${d.count === 1 ? "" : "s"}`];
          d.annotations.forEach((a, i) => {
            const r = a.viewportRect;
            const sel = a.selector ? ` selector=${a.selector}` : "";
            const by = a.restoredBy ? ` restoredBy=${a.restoredBy}` : "";
            const note = a.comment ? ` - ${a.comment}` : "";
            lines.push(`[${a.displayNumber ?? i + 1}] ${a.kind} x=${r.x} y=${r.y} w=${r.width} h=${r.height}${sel}${by}${note}`);
          });
          document.getElementById("out").innerHTML = [
            '<span class="p">$</span> abg annotate t1 --format text',
            ...lines.map((l) => `<span class="out">${esc(l).replace(/ - (.*)$/, ' - <span class="h">$1</span>')}</span>`),
            '<span class="p">$</span> <span class="cursor"></span>',
          ].join("\n");
          return true;
        });
    </script>
  </body>
</html>
