<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Small promo tile</title>
    <link rel="stylesheet" href="store.css" />
    <style>
      body { --w: 440px; --h: 280px; }
      .grid { -webkit-mask-image: radial-gradient(ellipse 60% 90% at 82% 50%, #000, transparent 80%); mask-image: radial-gradient(ellipse 60% 90% at 82% 50%, #000, transparent 80%); }
      /* The gate: a hairline across the tile, two pillars, and the one live signal. */
      .gate { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
      .gate .line {
        position: absolute; top: 139px; height: 2px;
        background: linear-gradient(90deg, rgba(61, 255, 143, 0), var(--signal) 40%, var(--signal));
        box-shadow: 0 0 10px var(--signal-glow);
      }
      .gate .line.l { left: 230px; width: 88px; }
      .gate .line.r { left: 386px; right: 0; background: var(--signal); }
      .gate .pillar { position: absolute; top: 86px; width: 10px; height: 108px; border-radius: 5px; background: var(--text); }
      .gate .pillar.a { left: 328px; }
      .gate .pillar.b { left: 366px; }
      .gate .dot {
        position: absolute; left: 343px; top: 126px; width: 18px; height: 18px; border-radius: 50%;
        background: var(--signal); box-shadow: 0 0 18px 4px var(--signal-glow), 0 0 60px 10px rgba(61, 255, 143, 0.25);
      }
      .halo {
        position: absolute; left: 352px; top: 140px; width: 380px; height: 380px; border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(closest-side, rgba(61, 255, 143, 0.16), transparent);
      }
      .text { position: absolute; left: 32px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
      .name { margin: 0; font-size: 31px; line-height: 1.04; font-weight: 660; letter-spacing: -0.035em; }
      .line2 { margin: 16px 0 0; font-size: 19px; line-height: 1.3; color: var(--text-2); letter-spacing: -0.01em; }
      .line2 b { color: var(--signal); font-weight: 560; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="halo"></div>
    <div class="gate">
      <i class="line l"></i><i class="line r"></i>
      <i class="pillar a"></i><i class="pillar b"></i>
      <i class="dot"></i>
    </div>
    <div class="text">
      <p class="name">Agent<br />Browser<br />Gateway</p>
      <p class="line2"><b>One tab.</b> Nothing else.</p>
    </div>
  </body>
</html>
