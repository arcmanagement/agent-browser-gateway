name: Reconcile release checksums

# Run after a maintainer uploads signed release assets to an existing release,
# so SHA256SUMS.txt, the *.sha256.txt files, and the cask match what users download.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.5.0"
        required: true

permissions:
  contents: write

concurrency:
  group: reconcile-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Reconcile checksums with the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: scripts/release/reconcile-release-checksums.sh
