name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-policy:
    name: CI policy
    runs-on: ubuntu-latest
    outputs:
      run_swift: ${{ steps.policy.outputs.run_swift }}
      run_extension: ${{ steps.policy.outputs.run_extension }}
      full_verification: ${{ steps.policy.outputs.full_verification }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide checks for this ref
        id: policy
        env:
          DEFAULT_BRANCH: main
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-change-policy.sh

      - name: Report CI policy
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ${{ steps.policy.outputs.summary }}
          EOF

  swift:
    name: Swift verification (macOS)
    needs: ci-policy
    if: needs.ci-policy.outputs.run_swift == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Swift debug build
        run: swift build

      - name: Swift tests with coverage
        run: swift test --enable-code-coverage

      - name: Swift service coverage gate
        run: scripts/swift-coverage-check.sh

      - name: Swift release build
        if: needs.ci-policy.outputs.full_verification == 'true'
        run: swift build -c release

  extension:
    name: Extension verification (Linux)
    needs: ci-policy
    if: needs.ci-policy.outputs.run_extension == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Typecheck extension
        working-directory: extension
        run: pnpm run typecheck

      - name: Lint extension
        working-directory: extension
        run: pnpm run lint

      - name: Test extension with coverage
        working-directory: extension
        run: pnpm run test:coverage

      - name: Build extension
        working-directory: extension
        run: pnpm run build
