name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Swift and extension tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Swift debug build
        run: swift build

      - name: Swift tests with coverage
        run: swift test --enable-code-coverage

      - name: Swift service coverage gate
        run: scripts/swift-coverage-check.sh

      - name: Swift release build
        run: swift build -c release

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Typecheck extension
        working-directory: extension
        run: pnpm run typecheck

      - name: Lint extension
        working-directory: extension
        run: pnpm run lint

      - name: Test extension with coverage
        working-directory: extension
        run: pnpm run test:coverage

      - name: Build extension
        working-directory: extension
        run: pnpm run build
