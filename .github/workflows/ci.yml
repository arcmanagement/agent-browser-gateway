name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release smoke-test version without the leading v"
        required: false
        default: "0.0.0-ci"

permissions:
  contents: read

# Cost policy (#94): the two protection jobs below always run, but only Swift
# needs a macOS runner — extension checks run on Linux. The heavy auxiliary
# jobs (release smoke, dependency inventory) run only when the files they
# validate change, so docs-only PRs consume one macOS runner at most.
jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.filter.outputs.release }}
      swiftdeps: ${{ steps.filter.outputs.swiftdeps }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            release:
              - 'Sources/**'
              - 'Tests/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'extension/**'
              - 'scripts/**'
              - 'packaging/**'
              - 'Makefile'
              - 'build-app.sh'
              - '.github/workflows/ci.yml'
            swiftdeps:
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/ci.yml'

  swift-tests:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Swift debug build
        run: swift build

      - name: Swift tests with coverage
        run: swift test --enable-code-coverage

      - name: Swift service coverage gate
        run: scripts/swift-coverage-check.sh

  extension-tests:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Typecheck extension
        working-directory: extension
        run: pnpm run typecheck

      - name: Lint extension
        working-directory: extension
        run: pnpm run lint

      - name: Test extension with coverage
        working-directory: extension
        run: pnpm run test:coverage

      - name: Build extension
        working-directory: extension
        run: pnpm run build

  release-artifact-smoke:
    name: Release artifact smoke test
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build unsigned release archives
        run: make dist VERSION="$RELEASE_VERSION"

      - name: Verify release archive outputs
        run: |
          set -euo pipefail
          test -f "dist/agent-browser-gateway-$RELEASE_VERSION-macos-arm64.zip"
          test -f "dist/agent-browser-gateway-extension-$RELEASE_VERSION.zip"
          test -f "dist/agent-browser-gateway.rb"
          ruby -c dist/agent-browser-gateway.rb
          shasum -a 256 \
            "dist/agent-browser-gateway-$RELEASE_VERSION-macos-arm64.zip" \
            "dist/agent-browser-gateway-extension-$RELEASE_VERSION.zip" \
            "dist/agent-browser-gateway.rb" \
            > dist/CI_SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ci-release-artifacts-${{ env.RELEASE_VERSION }}
          path: |
            dist/agent-browser-gateway-${{ env.RELEASE_VERSION }}-macos-arm64.zip
            dist/agent-browser-gateway-extension-${{ env.RELEASE_VERSION }}.zip
            dist/agent-browser-gateway.rb
            dist/CI_SHA256SUMS.txt

  swift-dependency-inventory:
    name: Swift dependency inventory
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.swiftdeps == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Write Swift dependency inventory
        run: swift package show-dependencies --format json > swift-dependencies.json

      - uses: actions/upload-artifact@v7
        with:
          name: ci-swift-dependencies
          path: swift-dependencies.json
