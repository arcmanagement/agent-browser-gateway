name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release smoke-test version without the leading v"
        required: false
        default: "0.0.0-ci"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: Swift and extension tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Swift debug build
        run: swift build

      - name: Swift tests with coverage
        run: swift test --enable-code-coverage

      - name: Swift service coverage gate
        run: scripts/swift-coverage-check.sh

      - name: Swift release build
        run: swift build -c release

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Typecheck extension
        working-directory: extension
        run: pnpm run typecheck

      - name: Lint extension
        working-directory: extension
        run: pnpm run lint

      - name: Test extension with coverage
        working-directory: extension
        run: pnpm run test:coverage

      - name: Build extension
        working-directory: extension
        run: pnpm run build

  chrome-extension-package:
    name: Chrome extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build Chrome Web Store ZIP
        working-directory: extension
        run: pnpm run webstore:zip

      - name: Verify ZIP root layout
        run: |
          set -euo pipefail
          zip_path="$(ls dist/agent-browser-gateway-extension-*.zip)"
          unzip -Z1 "$zip_path" | tee /tmp/extension-zip-entries.txt
          grep -qx "manifest.json" /tmp/extension-zip-entries.txt
          if grep -q "^dist/" /tmp/extension-zip-entries.txt; then
            echo "Extension ZIP must not contain a top-level dist/ directory." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ci-chrome-extension-webstore-zip
          path: dist/agent-browser-gateway-extension-*.zip

  release-artifact-smoke:
    name: Release artifact smoke test
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '0.0.0-ci' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Build unsigned release archives
        run: make dist VERSION="$RELEASE_VERSION"

      - name: Verify release archive outputs
        run: |
          set -euo pipefail
          test -f "dist/agent-browser-gateway-$RELEASE_VERSION-macos-arm64.zip"
          test -f "dist/agent-browser-gateway-extension-$RELEASE_VERSION.zip"
          test -f "dist/agent-browser-gateway.rb"
          ruby -c dist/agent-browser-gateway.rb
          shasum -a 256 \
            "dist/agent-browser-gateway-$RELEASE_VERSION-macos-arm64.zip" \
            "dist/agent-browser-gateway-extension-$RELEASE_VERSION.zip" \
            "dist/agent-browser-gateway.rb" \
            > dist/CI_SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ci-release-artifacts-${{ env.RELEASE_VERSION }}
          path: |
            dist/agent-browser-gateway-${{ env.RELEASE_VERSION }}-macos-arm64.zip
            dist/agent-browser-gateway-extension-${{ env.RELEASE_VERSION }}.zip
            dist/agent-browser-gateway.rb
            dist/CI_SHA256SUMS.txt

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: dependency-review
        name: Dependency Review advisory
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: on-failure
          show-patched-versions: true

      - name: Report advisory Dependency Review status
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::Dependency Review is advisory until this repository supports Dependency Review Action. Treat high-or-critical findings as release blockers."

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Audit extension dependencies
        working-directory: extension
        run: pnpm audit --audit-level high

  swift-dependency-inventory:
    name: Swift dependency inventory
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Ensure Package.resolved is committed
        run: git diff --exit-code -- Package.resolved

      - name: Write Swift dependency inventory
        run: swift package show-dependencies --format json > swift-dependencies.json

      - uses: actions/upload-artifact@v7
        with:
          name: ci-swift-dependencies
          path: swift-dependencies.json
