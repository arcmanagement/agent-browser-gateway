name: Dependency Security

on:
  pull_request:
    paths:
      - "Package.swift"
      - "Package.resolved"
      - "extension/package.json"
      - "extension/pnpm-lock.yaml"
      - "SECURITY.md"
      - ".github/workflows/dependency-security.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: dependency-review
        name: Dependency Review advisory
        continue-on-error: true
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: on-failure
          show-patched-versions: true

      - name: Report advisory Dependency Review status
        if: steps.dependency-review.outcome == 'failure'
        run: |
          echo "::warning::Dependency Review is advisory until this repository supports Dependency Review Action. Treat high-or-critical findings as release blockers."

  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: extension
        run: pnpm install --frozen-lockfile

      - name: Audit extension dependencies
        working-directory: extension
        run: pnpm audit --audit-level high

  swift-dependency-inventory:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve Swift dependencies
        run: swift package resolve

      - name: Ensure Package.resolved is committed
        run: git diff --exit-code -- Package.resolved

      - name: Write Swift dependency inventory
        run: swift package show-dependencies --format json > swift-dependencies.json

      - uses: actions/upload-artifact@v7
        with:
          name: swift-dependencies
          path: swift-dependencies.json
