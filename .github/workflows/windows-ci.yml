name: Windows CI

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: "Windows artifact version"
        required: true
        type: string
      release_tag:
        description: "GitHub Release tag to upload assets to"
        required: false
        type: string
      upload_release:
        description: "Upload signed Windows assets to the GitHub Release"
        required: false
        type: boolean
        default: false
      submit_winget:
        description: "Submit a WinGet PR after signed release assets are uploaded"
        required: false
        type: boolean
        default: false
      require_code_sign:
        description: "Fail unless Windows signing secrets are configured"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Windows artifact version"
        required: false
        default: "0.4.4"
      upload_release:
        description: "Upload signed Windows assets to the GitHub Release"
        required: false
        type: boolean
        default: false
      submit_winget:
        description: "Submit a WinGet PR after signed release assets are uploaded"
        required: false
        type: boolean
        default: false
      require_code_sign:
        description: "Fail unless Windows signing secrets are configured"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    env:
      HAS_WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
      HAS_WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD != '' }}
      HAS_WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}".TrimStart("v")
            $releaseTag = "${{ github.event.release.tag_name }}"
          } else {
            $version = "${{ inputs.version || '0.4.4' }}".TrimStart("v")
            $releaseTag = "${{ inputs.release_tag || '' }}"
            if ([string]::IsNullOrWhiteSpace($releaseTag)) {
              $releaseTag = "v$version"
            }
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is required."
          }
          "ABG_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: Resolve Windows release gates
        id: windows_release
        shell: pwsh
        run: |
          $canSign = $env:HAS_WINDOWS_CODESIGN_PFX_BASE64 -eq "true" -and
            $env:HAS_WINDOWS_CODESIGN_PFX_PASSWORD -eq "true"
          $canSubmitWinget = $canSign -and
            $env:HAS_WINGET_CREATE_GITHUB_TOKEN -eq "true"
          $shouldUploadRelease = "${{ github.event_name }}" -eq "release" -or
            "${{ inputs.upload_release }}" -eq "true"
          $shouldSubmitWinget = "${{ github.event_name }}" -eq "release" -or
            "${{ inputs.submit_winget }}" -eq "true"

          "can_sign=$($canSign.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "can_submit_winget=$($canSubmitWinget.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "should_upload_release=$($shouldUploadRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "should_submit_winget=$($shouldSubmitWinget.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($shouldUploadRelease -or $shouldSubmitWinget) {
            if (-not $canSign) {
              Write-Warning "Windows release assets and WinGet submission are skipped because Windows signing secrets are not configured."
              @"
          ### Windows release packaging

          Windows build and tests will run, but signed Windows release asset upload and WinGet submission are skipped.

          Required repository secrets:

          - ``WINDOWS_CODESIGN_PFX_BASE64``
          - ``WINDOWS_CODESIGN_PFX_PASSWORD``
          - ``WINGET_CREATE_GITHUB_TOKEN`` for WinGet submission
          "@ >> $env:GITHUB_STEP_SUMMARY
            } elseif ($shouldSubmitWinget -and -not $canSubmitWinget) {
              Write-Warning "Signed Windows release assets can be uploaded, but WinGet submission is skipped because WINGET_CREATE_GITHUB_TOKEN is not configured."
              @"
          ### Windows release packaging

          Signed Windows release assets can be uploaded. WinGet submission is skipped because ``WINGET_CREATE_GITHUB_TOKEN`` is not configured.
          "@ >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/AgentBrowserGateway.Windows.sln

      - name: Build
        run: |
          dotnet build windows/AgentBrowserGateway.Core/AgentBrowserGateway.Core.csproj -c Release --no-restore
          dotnet build windows/AgentBrowserGateway.Cli/AgentBrowserGateway.Cli.csproj -c Release --no-restore
          dotnet build windows/AgentBrowserGateway.Windows/AgentBrowserGateway.Windows.csproj -c Release -r win-x64 -p:Platform=x64

      - name: Test
        run: dotnet test windows/AgentBrowserGateway.Tests/AgentBrowserGateway.Tests.csproj -c Release

      - name: Decode Windows signing certificate
        if: ${{ steps.windows_release.outputs.can_sign == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "abg-windows-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          "WINDOWS_CODESIGN_PFX=$pfxPath" >> $env:GITHUB_ENV

      - name: Package Windows zip
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          $signArgs = @{}
          if ($env:WINDOWS_CODESIGN_PFX) {
            $signArgs["CodeSignPfxPath"] = $env:WINDOWS_CODESIGN_PFX
            $signArgs["CodeSignPfxPassword"] = $env:WINDOWS_CODESIGN_PFX_PASSWORD
          }
          if ("${{ inputs.require_code_sign }}" -eq "true") {
            $signArgs["RequireCodeSign"] = $true
          }
          ./scripts/dist-windows-x64.ps1 -Version $env:ABG_VERSION @signArgs

      - name: Resolve Microsoft Store MSIX version
        id: msix_version
        shell: pwsh
        run: |
          $parts = $env:ABG_VERSION.Split(".")
          if ($parts.Count -lt 3) {
            throw "ABG_VERSION must have at least major.minor.patch parts to derive a Store version."
          }
          $major = [int]$parts[0] + 1
          $minor = [int]$parts[1]
          $build = [int]$parts[2]
          $storeVersion = "$major.$minor.$build.0"
          "store_version=$storeVersion" >> $env:GITHUB_OUTPUT

      - name: Build Microsoft Store MSIX
        shell: pwsh
        run: |
          ./packaging/msix/build-msix.ps1 `
            -IdentityName "ArcManagementInc.AgentBrowserGateway" `
            -Publisher "CN=ACF7FCEE-0034-48CB-9C9C-D4EBFBE473EB" `
            -PublisherDisplayName "ArcManagement, Inc." `
            -Version "${{ steps.msix_version.outputs.store_version }}" `
            -SignForStore

      - name: Remove decoded signing certificate
        if: ${{ always() && steps.windows_release.outputs.can_sign == 'true' }}
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX) -and (Test-Path $env:WINDOWS_CODESIGN_PFX)) {
            Remove-Item $env:WINDOWS_CODESIGN_PFX -Force
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64
          if-no-files-found: error
          path: |
            dist/agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64.zip.sha256.txt
            dist/agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64-setup.zip
            dist/agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64-setup.zip.sha256.txt
            artifacts/msix/AgentBrowserGateway_${{ steps.msix_version.outputs.store_version }}_win-x64.msix

      - name: Upload Microsoft Store MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-browser-gateway-${{ steps.version.outputs.version }}-msix-store
          if-no-files-found: error
          path: artifacts/msix/AgentBrowserGateway_${{ steps.msix_version.outputs.store_version }}_win-x64.msix

      - name: Upload Windows assets to GitHub Release
        if: ${{ steps.windows_release.outputs.should_upload_release == 'true' && steps.windows_release.outputs.can_sign == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.release_tag }}" `
            "dist/agent-browser-gateway-$env:ABG_VERSION-windows-x64.zip" `
            "dist/agent-browser-gateway-$env:ABG_VERSION-windows-x64.zip.sha256.txt" `
            "dist/agent-browser-gateway-$env:ABG_VERSION-windows-x64-setup.zip" `
            "dist/agent-browser-gateway-$env:ABG_VERSION-windows-x64-setup.zip.sha256.txt" `
            "artifacts/msix/AgentBrowserGateway_${{ steps.msix_version.outputs.store_version }}_win-x64.msix" `
            --clobber

      - name: Generate WinGet manifests
        if: ${{ steps.windows_release.outputs.should_submit_winget == 'true' && steps.windows_release.outputs.can_submit_winget == 'true' }}
        shell: pwsh
        run: |
          $setupUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.release_tag }}/agent-browser-gateway-$env:ABG_VERSION-windows-x64-setup.zip"
          ./scripts/update-winget-manifest.ps1 -Version $env:ABG_VERSION -InstallerUrl $setupUrl

      - uses: actions/upload-artifact@v7
        if: ${{ steps.windows_release.outputs.should_submit_winget == 'true' && steps.windows_release.outputs.can_submit_winget == 'true' }}
        with:
          name: agent-browser-gateway-winget-${{ steps.version.outputs.version }}
          path: dist/winget/manifests/a/ArcManagement/AgentBrowserGateway/${{ steps.version.outputs.version }}

      - name: Submit WinGet PR
        if: ${{ steps.windows_release.outputs.should_submit_winget == 'true' && steps.windows_release.outputs.can_submit_winget == 'true' }}
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $manifestPath = "dist\winget\manifests\a\ArcManagement\AgentBrowserGateway\$env:ABG_VERSION"
          .\wingetcreate.exe submit $manifestPath --token $env:WINGET_CREATE_GITHUB_TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate submit failed with exit code $LASTEXITCODE"
          }
