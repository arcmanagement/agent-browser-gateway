name: Windows CI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Windows artifact version"
        required: false
        default: "0.4.1"
      require_code_sign:
        description: "Fail unless Windows signing secrets are configured"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    env:
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
      WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $version = "${{ github.event.release.tag_name }}".TrimStart("v")
          } else {
            $version = "${{ inputs.version || '0.4.1' }}".TrimStart("v")
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version is required."
          }
          "ABG_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/AgentBrowserGateway.Windows.sln

      - name: Build
        run: |
          dotnet build windows/AgentBrowserGateway.Core/AgentBrowserGateway.Core.csproj -c Release --no-restore
          dotnet build windows/AgentBrowserGateway.Cli/AgentBrowserGateway.Cli.csproj -c Release --no-restore
          dotnet build windows/AgentBrowserGateway.Windows/AgentBrowserGateway.Windows.csproj -c Release -r win-x64 -p:Platform=x64

      - name: Test
        run: dotnet test windows/AgentBrowserGateway.Tests/AgentBrowserGateway.Tests.csproj -c Release

      - name: Decode Windows signing certificate
        if: ${{ env.WINDOWS_CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "abg-windows-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          "WINDOWS_CODESIGN_PFX=$pfxPath" >> $env:GITHUB_ENV

      - name: Package Windows zip
        shell: pwsh
        run: |
          $signArgs = @{}
          if ($env:WINDOWS_CODESIGN_PFX) {
            $signArgs["CodeSignPfxPath"] = $env:WINDOWS_CODESIGN_PFX
            $signArgs["CodeSignPfxPassword"] = $env:WINDOWS_CODESIGN_PFX_PASSWORD
          }
          if ("${{ github.event_name }}" -eq "release" -or "${{ inputs.require_code_sign }}" -eq "true") {
            $signArgs["RequireCodeSign"] = $true
          }
          ./scripts/dist-windows-x64.ps1 -Version $env:ABG_VERSION @signArgs

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64
          if-no-files-found: error
          path: |
            dist/agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64.zip
            dist/agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64.zip.sha256.txt
            dist/agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64-setup.zip
            dist/agent-browser-gateway-${{ steps.version.outputs.version }}-windows-x64-setup.zip.sha256.txt

      - name: Upload Windows assets to GitHub Release
        if: ${{ github.event_name == 'release' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            "dist/agent-browser-gateway-$env:ABG_VERSION-windows-x64.zip" `
            "dist/agent-browser-gateway-$env:ABG_VERSION-windows-x64.zip.sha256.txt" `
            "dist/agent-browser-gateway-$env:ABG_VERSION-windows-x64-setup.zip" `
            "dist/agent-browser-gateway-$env:ABG_VERSION-windows-x64-setup.zip.sha256.txt" `
            --clobber

      - name: Generate WinGet manifests
        if: ${{ github.event_name == 'release' }}
        shell: pwsh
        run: ./scripts/update-winget-manifest.ps1 -Version $env:ABG_VERSION

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'release' }}
        with:
          name: agent-browser-gateway-winget-${{ steps.version.outputs.version }}
          path: dist/winget/manifests/a/ArcManagement/AgentBrowserGateway/${{ steps.version.outputs.version }}

      - name: Submit WinGet PR
        if: ${{ github.event_name == 'release' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            throw "WINGET_CREATE_GITHUB_TOKEN is required to submit to microsoft/winget-pkgs."
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $manifestPath = "dist\winget\manifests\a\ArcManagement\AgentBrowserGateway\$env:ABG_VERSION"
          .\wingetcreate.exe submit $manifestPath --token $env:WINGET_CREATE_GITHUB_TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw "wingetcreate submit failed with exit code $LASTEXITCODE"
          }
