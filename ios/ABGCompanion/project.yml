name: ABGCompanion
options:
  bundleIdPrefix: jp.co.arcm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "1600"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: M46W5MVAQP
    MARKETING_VERSION: "0.4.7"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ABGCompanion:
    type: application
    platform: iOS
    sources:
      - path: ABGCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.arcm.AgentBrowserGateway
        PRODUCT_NAME: Agent Browser Gateway
        INFOPLIST_FILE: ABGCompanion/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ABGCompanion/Info.plist
      properties:
        CFBundleDisplayName: ABG
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NSCameraUsageDescription: ABG Companion scans the pairing QR code shown by your desktop Gateway. The camera is used only while the scanner is open.
        NSLocalNetworkUsageDescription: ABG Companion connects to your own desktop Gateway on your private network to receive approval requests. It never contacts servers outside your network.
        NSBonjourServices:
          - _abg._tcp
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ABGCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ABGCompanionTests
    dependencies:
      - target: ABGCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.arcm.AgentBrowserGateway.companion.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Agent Browser Gateway.app/Agent Browser Gateway
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  ABGCompanion:
    build:
      targets:
        ABGCompanion: all
        ABGCompanionTests: [test]
    test:
      targets:
        - ABGCompanionTests
    run:
      config: Debug
    archive:
      config: Release
